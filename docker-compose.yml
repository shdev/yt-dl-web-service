services:
  yt-dl-web:
    build: .
    # NAS-Deployment ohne lokalen Build: "build: ." entfernen und stattdessen
    # das veröffentlichte Image ziehen (amd64):
    #   image: ghcr.io/shdev/yt-dl-web-service:latest
    # Lokal baut compose nativ für den Host — eigener Name, damit das
    # veröffentlichte amd64-Image (make image/push) nicht überschrieben wird.
    image: yt-dl-web-service-native
    container_name: yt-dl-web
    # UID:GID des NAS-Nutzers, dem die Downloads gehören sollen
    user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      MAX_CONCURRENT: "3"
      YTDLP_UPDATE_ON_START: "true"
      # OUTPUT_TEMPLATE: "%(title)s [%(id)s].%(ext)s"
    # Create ./data/downloads and ./data/config BEFORE first start (mkdir -p data/downloads data/config)
    # and make sure they are writable by the user above — otherwise Docker creates them root-owned
    # and the container cannot write (healthcheck stays green, but every job fails).
    volumes:
      - ./data/downloads:/downloads
      - ./data/config:/config
    restart: unless-stopped
